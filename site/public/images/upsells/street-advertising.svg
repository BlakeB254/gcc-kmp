<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="brown-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#92400e"/>
      <stop offset="100%" style="stop-color:#78350f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="#451a03"/>

  <!-- Street -->
  <rect x="0" y="320" width="800" height="80" fill="#374151"/>
  <rect x="0" y="355" width="800" height="10" fill="#fbbf24" opacity="0.5"/>

  <!-- Yard sign -->
  <rect x="100" y="180" width="150" height="100" rx="5" fill="white"/>
  <rect x="165" y="280" width="20" height="100" fill="#78350f"/>
  <text x="175" y="220" font-family="Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">This block cleaned by</text>
  <text x="175" y="250" font-family="Arial, sans-serif" font-size="20" fill="url(#brown-grad)" text-anchor="middle" font-weight="bold">YOUR BRAND</text>

  <!-- Banner -->
  <rect x="350" y="120" width="200" height="120" rx="5" fill="url(#brown-grad)"/>
  <rect x="340" y="100" width="10" height="160" fill="#78350f"/>
  <rect x="550" y="100" width="10" height="160" fill="#78350f"/>
  <text x="450" y="165" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">SPONSORED BY</text>
  <text x="450" y="200" font-family="Arial, sans-serif" font-size="24" fill="#fbbf24" text-anchor="middle" font-weight="bold">YOUR LOGO</text>

  <!-- A-Frame -->
  <polygon points="650,180 700,320 750,180" fill="white" stroke="#78350f" stroke-width="3"/>
  <text x="700" y="260" font-family="Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">SHOP</text>
  <text x="700" y="280" font-family="Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">LOCAL</text>

  <text x="400" y="60" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">Own the Block</text>
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="16" fill="#fcd34d" text-anchor="middle">Signs, banners, and street presence</text>
</svg>
