<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <rect width="800" height="400" fill="#14532d"/>

  <!-- Garden bed -->
  <rect x="100" y="250" width="250" height="100" rx="10" fill="#78350f"/>
  <!-- Plants -->
  <rect x="130" y="180" width="10" height="80" fill="#22c55e"/>
  <ellipse cx="135" cy="165" rx="25" ry="20" fill="#4ade80"/>
  <rect x="190" y="160" width="12" height="100" fill="#22c55e"/>
  <ellipse cx="196" cy="140" rx="30" ry="25" fill="#16a34a"/>
  <rect x="260" y="170" width="10" height="90" fill="#22c55e"/>
  <ellipse cx="265" cy="155" rx="22" ry="18" fill="#4ade80"/>
  <rect x="310" y="190" width="8" height="70" fill="#22c55e"/>
  <ellipse cx="314" cy="175" rx="18" ry="15" fill="#22c55e"/>

  <!-- Tree well -->
  <rect x="450" y="200" width="150" height="150" rx="10" fill="#78350f"/>
  <rect x="517" y="100" width="16" height="110" fill="#78350f"/>
  <ellipse cx="525" cy="80" rx="60" ry="50" fill="#166534"/>
  <ellipse cx="505" cy="95" rx="40" ry="35" fill="#22c55e"/>
  <ellipse cx="545" cy="90" rx="45" ry="40" fill="#16a34a"/>
  <!-- Mulch -->
  <ellipse cx="525" cy="310" rx="55" ry="30" fill="#92400e"/>

  <!-- Sun -->
  <circle cx="700" cy="80" r="40" fill="#fbbf24"/>
  <line x1="700" y1="20" x2="700" y2="5" stroke="#fbbf24" stroke-width="4"/>
  <line x1="740" y1="40" x2="755" y2="30" stroke="#fbbf24" stroke-width="4"/>
  <line x1="755" y1="80" x2="770" y2="80" stroke="#fbbf24" stroke-width="4"/>

  <text x="400" y="45" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">Greening the Neighborhood</text>
  <text x="225" y="380" font-family="Arial, sans-serif" font-size="14" fill="#a7f3d0" text-anchor="middle">Community Gardens</text>
  <text x="525" y="380" font-family="Arial, sans-serif" font-size="14" fill="#a7f3d0" text-anchor="middle">Tree Well Care</text>
</svg>
