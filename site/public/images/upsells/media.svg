<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="media-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="#0c4a6e"/>

  <!-- Camera -->
  <rect x="100" y="150" width="120" height="80" rx="10" fill="#1f2937"/>
  <circle cx="160" cy="190" r="30" fill="#374151"/>
  <circle cx="160" cy="190" r="20" fill="#0ea5e9"/>
  <circle cx="160" cy="190" r="8" fill="#1f2937"/>
  <rect x="130" y="155" width="20" height="10" rx="2" fill="#374151"/>
  <!-- Flash -->
  <polygon points="180,140 200,120 220,140 200,145" fill="#fbbf24"/>

  <!-- Drone -->
  <ellipse cx="400" cy="100" rx="40" ry="10" fill="#374151"/>
  <rect x="375" y="100" width="50" height="30" rx="5" fill="#1f2937"/>
  <circle cx="400" cy="115" r="10" fill="#0ea5e9"/>
  <line x1="355" y1="105" x2="340" y2="95" stroke="#374151" stroke-width="3"/>
  <line x1="445" y1="105" x2="460" y2="95" stroke="#374151" stroke-width="3"/>
  <circle cx="340" cy="90" r="15" fill="#374151" opacity="0.5"/>
  <circle cx="460" cy="90" r="15" fill="#374151" opacity="0.5"/>
  <!-- Drone camera view -->
  <path d="M 380 130 L 340 200 L 460 200 L 420 130" fill="#0ea5e9" opacity="0.3"/>

  <!-- Video camera -->
  <rect x="550" y="140" width="100" height="70" rx="8" fill="#1f2937"/>
  <polygon points="650,155 700,140 700,195 650,180" fill="#374151"/>
  <circle cx="580" cy="175" r="15" fill="#ef4444"/>
  <text x="578" y="180" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">REC</text>

  <!-- Photo frames -->
  <rect x="120" y="270" width="100" height="80" rx="5" fill="white"/>
  <rect x="125" y="275" width="90" height="60" fill="url(#media-grad)"/>
  <text x="170" y="310" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">BEFORE</text>

  <rect x="250" y="270" width="100" height="80" rx="5" fill="white"/>
  <rect x="255" y="275" width="90" height="60" fill="#22c55e"/>
  <text x="300" y="310" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">AFTER</text>

  <!-- Film strip -->
  <rect x="400" y="260" width="200" height="100" rx="5" fill="#1f2937"/>
  <rect x="405" y="265" width="25" height="20" fill="#374151"/>
  <rect x="435" y="265" width="25" height="20" fill="#374151"/>
  <rect x="465" y="265" width="25" height="20" fill="#374151"/>
  <rect x="405" y="335" width="25" height="20" fill="#374151"/>
  <rect x="435" y="335" width="25" height="20" fill="#374151"/>
  <rect x="465" y="335" width="25" height="20" fill="#374151"/>
  <polygon points="470,300 500,320 470,340" fill="white"/>
  <text x="540" y="310" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">Documentary</text>

  <text x="400" y="45" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">Capture Your Impact Story</text>
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="14" fill="#7dd3fc" text-anchor="middle">Professional photography, video, and drone footage</text>
</svg>
