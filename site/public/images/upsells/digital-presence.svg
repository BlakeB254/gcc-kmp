<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="#0c4a6e"/>

  <!-- Phone mockup -->
  <rect x="80" y="80" width="180" height="300" rx="20" fill="#1e293b"/>
  <rect x="90" y="95" width="160" height="260" rx="5" fill="white"/>
  <rect x="100" y="105" width="140" height="100" fill="url(#sky-grad)"/>
  <text x="170" y="150" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">@YourBrand</text>
  <text x="170" y="175" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Cleaning in progress!</text>
  <rect x="100" y="215" width="140" height="10" rx="2" fill="#e5e7eb"/>
  <rect x="100" y="235" width="100" height="10" rx="2" fill="#e5e7eb"/>
  <circle cx="115" cy="275" r="10" fill="#ef4444"/>
  <circle cx="145" cy="275" r="10" fill="#e5e7eb"/>
  <circle cx="175" cy="275" r="10" fill="#e5e7eb"/>

  <!-- Instagram post mockup -->
  <rect x="320" y="100" width="200" height="250" rx="10" fill="white"/>
  <rect x="330" y="110" width="180" height="140" fill="url(#sky-grad)"/>
  <text x="420" y="175" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">BEFORE/AFTER</text>
  <text x="420" y="195" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">@sponsor_logo</text>
  <text x="345" y="275" font-family="Arial, sans-serif" font-size="10" fill="#1f2937">Thanks to @YourBrand</text>
  <text x="345" y="290" font-family="Arial, sans-serif" font-size="10" fill="#1f2937">for sponsoring this block!</text>
  <text x="345" y="330" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">2,847 likes</text>

  <!-- Video icon -->
  <rect x="580" y="130" width="160" height="120" rx="10" fill="#1e293b"/>
  <polygon points="640,170 640,210 680,190" fill="white"/>
  <text x="660" y="280" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Video Testimonial</text>
  <text x="660" y="300" font-family="Arial, sans-serif" font-size="12" fill="#7dd3fc" text-anchor="middle">15-sec clips</text>

  <text x="400" y="50" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">Amplify Your Impact Online</text>
</svg>
