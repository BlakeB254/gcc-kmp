/Home\"\n      fi\n      ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode\n    fi\n    RESOURCE_TARGET=\"iosSimulatorArm64\"\n    if echo \" ${ARCHS:-} \" | grep -q \" x86_64 \"; then\n      RESOURCE_TARGET=\"iosX64\"\n    fi\n    copy_compose_resources \"$RESOURCE_TARGET\"\n    ;;\nesac\n";
