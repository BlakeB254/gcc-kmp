name: ci

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'site/docs/**'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'site/docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Cancel superseded PR runs; keep main-branch runs running to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Next.js — typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    env:
      # Build-time stand-ins for required env vars. Real values live in Vercel
      # project settings. These satisfy the fail-fast guards in lib/auth.ts,
      # lib/mobile-auth.ts, and lib/env.ts during `next build`.
      JWT_SECRET: ci-dummy-secret-not-used-at-runtime
      NEXT_PUBLIC_APP_URL: http://ci.example
      NEXT_PUBLIC_TILE_SERVER_URL: http://ci.example
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      RESEND_API_KEY: re_ci_dummy
      ADMIN_EMAILS: ci@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Lint step intentionally omitted: `next lint` was removed in Next 16
      # and the project has no eslint.config.mjs (the implicit Next-bundled
      # config went away with it). Re-enable once a flat ESLint config is
      # added — likely `npx eslint .` against an eslint.config.mjs that
      # extends @next/eslint-plugin-next.

      - name: Build
        run: npm run build

  kotlin:
    name: Kotlin — shared + compose desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: ci-dummy-secret-not-used-at-runtime
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      # The two stores ship one release line: Android versionCode/versionName
      # must equal iOS CFBundleVersion/CFBundleShortVersionString. This was a
      # comment in composeApp/build.gradle.kts until PR #280 shipped iOS 189
      # and left Android on 188, so it is a gate now. Cheap, so it runs first.
      - name: Check iOS/Android version parity
        run: ./scripts/check-version-parity.sh

      # Note: we deliberately avoid `:shared:build` and `:composeApp:build`
      # because both declare `androidTarget()`, which requires the Android SDK
      # (not installed on this runner). Instead we drive the JVM + Desktop
      # targets explicitly, which still compile commonMain end-to-end and
      # catch the vast majority of regressions.
      #
      # Real device builds happen off-runner, split by platform:
      #   iOS      → MacBook Air via cdx-mobile (.cdx-mobile.yaml). Signing
      #              lives here. Kotlin/Native builds Apple frameworks only
      #              on macOS, so this cannot move.
      #   Android  → ms-a2 (x86-64) only. See docs/android-build-msa2.md.
      #              The MacBook is deliberately NOT an Android host, and the
      #              DGX Spark cannot be one: no ARM64-Linux aapt2.
      #
      # The optional `android-debug` job below provisions the SDK for
      # occasional full Android verification on a runner.

      - name: Compile + test shared (JVM target)
        run: ./gradlew :shared:jvmJar :shared:jvmTest --no-daemon --stacktrace

      # There is no :server project — its source was deleted and
      # include(":server") is gone from settings.gradle.kts, so nothing here
      # builds it. This repo has no branch protection, so the job name above
      # is free to track reality.

      - name: Compile composeApp (desktop target)
        run: ./gradlew :composeApp:compileKotlinDesktop --no-daemon --stacktrace

      - name: Test composeApp (desktop target)
        run: ./gradlew :composeApp:desktopTest --no-daemon --stacktrace

  # Optional Android build, manual trigger only. Slow because it has to
  # install the Android SDK. Use this to verify pure-Kotlin Android compile
  # before tagging an iOS-prepped release; the actual APK signing still
  # happens on the MacBook via fastlane.
  android-debug:
    name: Android — assembleDebug (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gcc-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 14
